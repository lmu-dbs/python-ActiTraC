[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "actitrac"
version = "0.1.0"
description = "Python implementation of ActiTraC and ActiTraC-MO: active trace clustering for process discovery"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
# Petri-net miners, alignments, precision and ActiTraC-MO. pm4py is AGPL-3.0.
pm4py = ["pm4py>=2.7"]
dev = ["pytest>=7", "pm4py>=2.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["pm4py: requires the optional pm4py dependency"]
